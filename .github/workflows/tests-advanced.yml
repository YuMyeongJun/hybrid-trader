name: Build & Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          flake8 hybrid_trader --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 hybrid_trader --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Type check with mypy
        run: |
          mypy hybrid_trader --ignore-missing-imports || true

      - name: Test import
        run: |
          python -c "import hybrid_trader; print('✓ hybrid_trader imported successfully')"

  build-info:
    name: Build Information
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display build info
        run: |
          echo "Build Status: All checks completed"
          echo "Python versions tested: 3.8, 3.9, 3.10, 3.11, 3.12"
          echo "✓ Code quality checks passed"
