name: Deploy to PyPI

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Step 1: Validate and build the distribution
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG}"

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$(python -c "from pathlib import Path; import re; content = Path('setup.py').read_text(); match = re.search(r'version=\"([^\"]+)\"', content); print(match.group(1) if match else '')")
          if [ "$VERSION" != "$TAG" ]; then
            echo "Error: Version mismatch"
            echo "  setup.py version: $VERSION"
            echo "  git tag: $TAG"
            exit 1
          fi
          echo "Version verified: $TAG"

      - name: Build distribution packages
        run: |
          python -m build

      - name: Validate distribution with twine
        run: |
          twine check dist/* --strict

      - name: List distribution contents
        run: |
          echo "=== Wheel contents ==="
          python -m zipfile -l dist/*.whl
          echo ""
          echo "=== Sdist contents ==="
          tar -tzf dist/*.tar.gz | head -20

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 30

  # Step 2: Test on TestPyPI
  test-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release-test
    if: github.event_name == 'release'

    steps:
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Install twine
        run: python -m pip install twine

      - name: Publish to TestPyPI
        run: |
          twine upload dist/* \
            --repository testpypi \
            --username __token__ \
            --password ${{ secrets.TEST_PYPI_API_TOKEN }} \
            --skip-existing \
            --verbose
        continue-on-error: true

      - name: Wait for TestPyPI package availability
        run: sleep 10

      - name: Test install from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ hybrid-trader --extra-index-url https://pypi.org/simple/ || echo "TestPyPI test skipped"
        continue-on-error: true

  # Step 3: Publish to production PyPI
  publish:
    needs: [build, test-pypi]
    runs-on: ubuntu-latest
    environment: release
    if: github.event_name == 'release'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

      - name: Verify PyPI publication
        run: |
          echo "Package published to PyPI"
          echo "Installation command: pip install hybrid-trader"
          echo "Package URL: https://pypi.org/project/hybrid-trader/"

  # Step 4: Test on multiple Python versions
  test-install:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for package availability
        run: sleep 30

      - name: Install hybrid-trader
        run: |
          python -m pip install --upgrade pip
          pip install hybrid-trader

      - name: Verify installation
        run: |
          python -c "
          import hybrid_trader
          print(f'Python {__import__(\"sys\").version}')
          print(f'hybrid-trader installed successfully')
          print(f'Package location: {hybrid_trader.__file__}')
          "

  # Step 5: Create release summary
  summary:
    needs: [publish, test-install]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release Summary
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "## PyPI Release Summary" > release_summary.md
          echo "" >> release_summary.md
          echo "**Version:** $VERSION" >> release_summary.md
          echo "**Released:** $(date)" >> release_summary.md
          echo "" >> release_summary.md
          echo "### Installation" >> release_summary.md
          echo '```bash' >> release_summary.md
          echo "pip install hybrid-trader" >> release_summary.md
          echo '```' >> release_summary.md
          echo "" >> release_summary.md
          echo "### Links" >> release_summary.md
          echo "- [PyPI Package](https://pypi.org/project/hybrid-trader/$VERSION/)" >> release_summary.md
          echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/$VERSION)" >> release_summary.md
          echo "- [GitHub Issues](https://github.com/${{ github.repository }}/issues)" >> release_summary.md
          cat release_summary.md

      - name: Comment on Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('release_summary.md', 'utf8');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: summary
            });
        continue-on-error: true
