[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-trader"
version = "0.1.0"
description = "Unified Python library for Korean stock (KIS) and crypto (Upbit) automated trading"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "MJ YU", email = "dev.claude@blumn.ai"}
]
maintainers = [
    {name = "MJ YU", email = "dev.claude@blumn.ai"}
]
keywords = [
    "trading",
    "automated-trading",
    "stock",
    "cryptocurrency",
    "kis",
    "upbit",
    "korea",
    "finance",
    "investing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

dependencies = [
    "python-kis>=0.3.0",
    "pyupbit>=0.2.35",
    "requests>=2.28.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
    "mypy>=0.950",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]
lint = [
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/mjyu-louis/hybrid-trader"
Documentation = "https://github.com/mjyu-louis/hybrid-trader/blob/main/README.md"
Repository = "https://github.com/mjyu-louis/hybrid-trader.git"
"Bug Reports" = "https://github.com/mjyu-louis/hybrid-trader/issues"
"API Reference" = "https://github.com/mjyu-louis/hybrid-trader/blob/main/docs/API.md"
Examples = "https://github.com/mjyu-louis/hybrid-trader/tree/main/examples"
Contributing = "https://github.com/mjyu-louis/hybrid-trader/blob/main/docs/CONTRIBUTING.md"

[tool.setuptools]
packages = ["hybrid_trader"]
include-package-data = true

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["hybrid_trader"]
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pyupbit.*", "kis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=hybrid_trader --cov-report=html --cov-report=term-missing"
